# T-047.3: Render service definition.
#
# This is a static-data-serving Flask app — no build step beyond installing
# dependencies, no database service (SQLite ships as a file in the repo; see
# CLAUDE.md and pipeline/README.md for why and how it gets there).

services:
  - type: web
    name: nba-shot-quality-model
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.run:app"
    envVars:
      - key: DEBUG
        value: "false"
      - key: DB_PATH
        value: "db/nba_shot_quality.sqlite3"
      - key: PYTHON_VERSION
        value: "3.13.5"
    healthCheckPath: /health
